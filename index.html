<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lima Finanças</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#144a95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lima Finanças" />
    <link rel="icon" href="https://picsum.photos/seed/finance/192/192" />
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/finance/192/192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => {
              console.log('Service Worker registrado!', reg);
              
              // Check for updates every time the page is loaded
              reg.update();

              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      // New content is available, but it will only be used when all tabs are closed
                      console.log('Nova versão disponível! Por favor, recarregue a página.');
                      // Optional: Show a UI notification to the user
                    }
                  }
                };
              };
            })
            .catch(err => console.log('Erro ao registrar Service Worker', err));
        });

        // Ensure that the new service worker takes over immediately
        let refreshing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          window.location.reload();
          refreshing = true;
        });
      }
    </script>
  </body>
</html>
